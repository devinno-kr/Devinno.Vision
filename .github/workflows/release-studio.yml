# 태그(studio-v1.2.3)를 올리면 테스트 → Studio 를 그 버전으로 publish(win-x64) → zip 을 GitHub Release 에 올린다.
# .NET 런타임은 넣지 않는다 (zip 크기) — 쓰는 PC 에 .NET 9 SDK, 또는 .NET 9 Desktop Runtime + ASP.NET Core Runtime 이 있어야 한다.
# NuGet 패키지는 다른 태그(v1.2.3)로 따로 나간다 — publish-nuget.yml. 두 버전은 서로 묶이지 않는다: 둘 사이의 약속은 레시피 FormatVersion 이다.
# zip 에 들어가지 않는 것(저장소에 없다): 양품 모델의 특징 모델(models/features.onnx), MediaMTX(tools/mediamtx/), ffmpeg. 없어도 Studio 는 뜨고, 그 기능을 쓸 때 받는 방법을 알려 준다.
name: Release Studio

on:
  push:
    tags:
      - 'studio-v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write         # GitHub Release 만들기
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^studio-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "태그 '${{ github.ref_name }}' 가 studio-v1.2.3 형식이 아닙니다." }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Devinno.Vision.slnx -c Release

      - name: Test
        run: dotnet test Devinno.Vision.slnx -c Release --no-build

      # StudioVersion 은 Studio 의 버전만 바꾼다 (같이 들어가는 Devinno.Vision.dll 은 저장소의 라이브러리 버전 그대로)
      - name: Publish
        run: dotnet publish src/Devinno.Vision.Studio -c Release -r win-x64 --self-contained false -p:StudioVersion=${{ env.VERSION }} -o stage/DevinnoVisionStudio

      - name: Add documents
        shell: pwsh
        run: |
          $dir = 'stage/DevinnoVisionStudio'
          (Get-Content src/Devinno.Vision.Studio/llms.txt -Raw).Replace('{{VERSION}}', $env:VERSION) | Set-Content "$dir/llms.txt" -Encoding utf8
          Copy-Item LICENSE, README.md, README.ko.md, src/Devinno.Vision.Studio/THIRD-PARTY-NOTICES.md $dir
          # 제3자 라이선스: NuGet 패키지 안의 라이선스 · 고지 파일을 그대로 licenses/<패키지>/ 로 (THIRD-PARTY-NOTICES.md 가 가리킨다)
          $packages = ((dotnet nuget locals global-packages -l) -replace '^[^:]*:\s*', '').Trim()
          foreach ($id in 'microsoft.ml.onnxruntime', 'skiasharp', 'skiasharp.nativeassets.win32', 'mqttnet', 'opentk.redist.glfw', 'ffmpeg.autogen', 'system.io.ports', 'devinno.ui') {
            $pkg = Get-ChildItem (Join-Path $packages $id) -Directory | Sort-Object Name | Select-Object -Last 1
            if (-not $pkg) { throw "NuGet 캐시에 $id 가 없습니다." }
            $files = Get-ChildItem $pkg.FullName -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|ThirdPartyNotices|THIRD-PARTY-NOTICES)' }
            if (-not $files) { throw "$id 에 라이선스 파일이 없습니다." }
            $to = New-Item -ItemType Directory -Force (Join-Path $dir "licenses/$id")
            $files | Copy-Item -Destination $to
          }
          Copy-Item assets $dir -Recurse   # README 의 스크린샷
          Get-ChildItem $dir -Recurse -Filter *.pdb | Remove-Item   # 디버그 기호는 배포하지 않는다 (libSkiaSharp.pdb 만 80 MB)
          if (-not (Test-Path "$dir/Devinno.Vision.Studio.exe")) { throw 'Devinno.Vision.Studio.exe 가 없습니다.' }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path stage/DevinnoVisionStudio -DestinationPath "DevinnoVisionStudio-$env:VERSION-win-x64.zip"

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lib = ([xml](Get-Content src/Devinno.Vision/Devinno.Vision.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $notes = "Devinno Vision Studio $env:VERSION (Windows x64).`n`nNeeds the .NET 9 SDK, or the .NET 9 Desktop Runtime and the ASP.NET Core Runtime 9. Built with the Devinno.Vision library $lib. Unzip and run Devinno.Vision.Studio.exe. For AI tools: llms.txt in the zip."
          gh release create "${{ github.ref_name }}" "DevinnoVisionStudio-$env:VERSION-win-x64.zip" --title "Devinno Vision Studio $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
