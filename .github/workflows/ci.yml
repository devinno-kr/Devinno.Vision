# 태그 없이 도는 검사 — build → test → pack(게시 없음) → nupkg 를 artifact 로. 태그(publish-nuget.yml · release-studio.yml) 전에 이것을 초록으로 만든다.
# 수동 실행만(Actions 탭 또는 gh workflow run ci.yml) — push 마다 돌리지 않는다(비공개 저장소 Windows 러너 사용 시간).
name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest   # Studio(net9.0-windows) 와 OpenCvSharp4.runtime.win 때문에 Windows
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Devinno.Vision.slnx -c Release

      # Studio 테스트의 가짜 학습 스크립트는 PATH 의 python.exe 를 쓴다 (러너에 들어 있다)
      - name: Test
        run: dotnet test Devinno.Vision.slnx -c Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          foreach ($p in 'Devinno.Vision', 'Devinno.Vision.UI', 'Devinno.Vision.FlashCap') {
            dotnet pack src/$p -c Release --no-build -o out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-ci
          path: out/*.nupkg
